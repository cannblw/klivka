# Defaults to SQLite. For PostgreSQL, set:
#   DB_ADAPTER=postgresql DB_HOST=localhost DB_USERNAME=postgres DB_PASSWORD=postgres

default: &default
  adapter: <%= ENV["DB_ADAPTER"] || "sqlite3" %>
  host: <%= ENV["DB_HOST"] %>
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>
  timeout: 5000

development:
  <<: *default
  database: <%= ENV["DB_ADAPTER"] == "postgresql" ? "klivka_dev" : "storage/development.sqlite3" %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV["DB_ADAPTER"] == "postgresql" ? "klivka_test" : "storage/test.sqlite3" %>
  pool: 5

production:
  primary:
    <<: *default
    database: <%= ENV["DB_ADAPTER"] == "postgresql" ? ENV.fetch("DB_NAME", "klivka") : "storage/production.sqlite3" %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    pool: <%= Rails.application.config.x.queue_database_pool %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
