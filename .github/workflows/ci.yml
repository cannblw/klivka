name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      - name: Lint ERB templates
        run: bin/erb_lint --format compact --lint-all

  test-sqlite:
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Verify application autoloading
        env:
          RAILS_ENV: test
        run: bin/rails zeitwerk:check

      - name: Run tests (SQLite)
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test

      - name: Run system tests (SQLite)
        env:
          RAILS_ENV: test
        run: bin/rails test:system

  test-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klivka_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Create database
        run: bin/rails db:create db:schema:load
        env:
          DB_ADAPTER: postgresql
          DB_HOST: localhost
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Run tests (PostgreSQL)
        run: bin/rails test
        env:
          DB_ADAPTER: postgresql
          DB_HOST: localhost
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

  publish-development-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ scan_ruby, scan_js, lint, test-sqlite, test-postgresql ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: development-image
      cancel-in-progress: true
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish development image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:development
            ${{ env.IMAGE_NAME }}:development-${{ github.run_number }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=development
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Keep the ten newest development images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
        run: |
          if [[ "$OWNER_TYPE" == "Organization" ]]; then
            package_endpoint="/orgs/$OWNER/packages/container/$PACKAGE_NAME"
          else
            package_endpoint="/users/$OWNER/packages/container/$PACKAGE_NAME"
          fi

          mapfile -t old_version_ids < <(
            gh api --paginate \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$package_endpoint/versions?per_page=100" \
              --jq '.[] | select(any(.metadata.container.tags[]?; startswith("development-"))) | select(all(.metadata.container.tags[]?; startswith("development"))) | [.created_at, .id] | @tsv' |
              sort --reverse |
              tail --lines=+11 |
              cut --fields=2
          )

          for version_id in "${old_version_ids[@]}"; do
            gh api --method DELETE \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$package_endpoint/versions/$version_id"
          done
